import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
  id 'groovy'
  id 'java-gradle-plugin'
  id 'signing'
  id 'maven-publish'
  id 'com.gradle.plugin-publish' version '2.1.1'
  id "io.github.ben-manes.versions" version "0.61.0"
}

group = 'se.alipsa.gmd'
def publishVersion = project.findProperty("publish.version")
def revision = null
if (!publishVersion) {
  revision = providers.fileContents(layout.projectDirectory.file('../pom.xml')).asText.orElse('').map { pomText ->
    if (!pomText) {
      throw new GradleException('Could not read the project revision from ../pom.xml')
    }
    try {
      def documentBuilderFactory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
      documentBuilderFactory.setNamespaceAware(true)
      documentBuilderFactory.setFeature(javax.xml.XMLConstants.FEATURE_SECURE_PROCESSING, true)
      documentBuilderFactory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
      documentBuilderFactory.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
      documentBuilderFactory.setFeature('http://xml.org/sax/features/external-general-entities', false)
      documentBuilderFactory.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
      documentBuilderFactory.setAttribute(javax.xml.XMLConstants.ACCESS_EXTERNAL_DTD, '')
      documentBuilderFactory.setAttribute(javax.xml.XMLConstants.ACCESS_EXTERNAL_SCHEMA, '')
      documentBuilderFactory.setXIncludeAware(false)
      documentBuilderFactory.setExpandEntityReferences(false)
      def document = documentBuilderFactory.newDocumentBuilder().parse(
          new org.xml.sax.InputSource(new java.io.StringReader(pomText))
      )
      String value = javax.xml.xpath.XPathFactory.newInstance().newXPath().evaluate(
          "/*[local-name()='project']/*[local-name()='properties']/*[local-name()='revision']",
          document
      )?.trim()
      if (!value) {
        throw new GradleException('Could not read the project revision from ../pom.xml')
      }
      value
    } catch (GradleException e) {
      throw e
    } catch (Exception e) {
      throw new GradleException('Could not read the project revision from ../pom.xml', e)
    }
  }.get()
}
version = publishVersion ?: revision
def pluginVersion = version.toString()
description = 'Compiles gmd files into markdown, html or pdf'

processResources {
  inputs.property('gmdVersion', pluginVersion)
  filesMatching('gmd-version.properties') {
    expand(gmdVersion: pluginVersion)
  }
}

gradlePlugin {
  website.set("https://github.com/Alipsa/GroovyMarkdown")
  vcsUrl.set("https://github.com/Alipsa/GroovyMarkdown.git")
  plugins {
    simplePlugin {
      id = "${project.group}.${project.name}"
      implementationClass = 'se.alipsa.gmd.gradle.GmdGradlePlugin'
      displayName = "Gmd Plugin"
      description = project.description
      tags.set(["markdown", "Groovy", "pdf", "html", "gmd"])
      compatibility(it) {
        features {
          configurationCache = true
        }
      }
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation platform('org.junit:junit-bom:6.1.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.junit.platform:junit-platform-launcher'
}

test {
  systemProperty('gmd.plugin.version', pluginVersion)
  systemProperty('gmd.publish.version', publishVersion ?: '')
  systemProperty('gmd.root.pom', layout.projectDirectory.file('../pom.xml').asFile.absolutePath)
  useJUnitPlatform()
  testLogging {
    // set options for log level LIFECYCLE
    events TestLogEvent.FAILED,
        TestLogEvent.PASSED,
        TestLogEvent.SKIPPED,
        TestLogEvent.STANDARD_OUT,
        TestLogEvent.STANDARD_ERROR

    exceptionFormat = TestExceptionFormat.FULL
    showExceptions = true
    showCauses = true
    showStackTraces = true
    showStandardStreams = true
  }
}

project.afterEvaluate {
  tasks.matching { it.name == 'publishPlugins' }.configureEach {
    doFirst {
      if (!publishVersion) {
        throw new GradleException('publishPlugins requires -Ppublish.version=<release-version>')
      }
    }
  }
  tasks.named('signPluginMavenPublication') {
    enabled = project.findProperty('signing.keyId') != null
  }
  tasks.named("signSimplePluginPluginMarkerMavenPublication") {
    enabled = project.findProperty('signing.keyId') != null
  }
}
